# .air.toml
# Air configuration for quickcrawl live reload

root = "."
tmp_dir = "tmp"

[build]
  bin = "tmp/quickcrawl-server"
  cmd = "go build -o tmp/quickcrawl-server ./cmd/server"
  delay = 1000
  exclude_dir = ["tmp", "vendor", "playground", "node_modules", ".git"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html"]
  kill_delay = "0s"
  log = "build-errors.log"
  send_interrupt = false
  stop_on_error = true

[log]
  time = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true