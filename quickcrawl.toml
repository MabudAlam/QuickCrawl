[server]
host = "0.0.0.0"
port = 3000
request_timeout_secs = 60
rate_limit_rps = 10

[renderer]
page_timeout_ms = 45000
pool_size = 4
render_mode = "auto"
browser = "cloak"

[renderer.chrome]
# Cloak browser config - CloakBrowser creates dynamic Chrome instances
# Use just the base URL without browser ID path
ws_url = "ws://cloakbrowser-production-7be4.up.railway.app"
chrome_intercept_resources = true
# Cloak doesn't need chrome args encoding
chrome_args = []

[crawler]
max_concurrency = 40
requests_per_second = 40.0
respect_robots_txt = false
user_agent = ""
default_max_depth = 2
default_max_pages = 100
job_ttl_secs = 3600

[crawler.stealth]
enabled = true
strategy = "modern_browser"
jitter_factor = 0.2
inject_headers = true
nav_budget_ms = 12000

[extraction.llm]
api_key = ""
model = "gpt-4o-mini"
base_url = ""
max_tokens = 8192
extraction_prompt = "You are a data extraction assistant. Extract structured data from the user's content according to the provided JSON schema. Return ONLY the JSON object that matches the schema."
response_format = "extracted_data"

[cache]
enabled = true
redis_url = "redis://default:IkWLwrHLFbohJnDnYWilLYXnyUmvIoCi@acela.proxy.rlwy.net:28402"
ttl_default_secs = 3600
