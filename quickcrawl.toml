[server]
host = "0.0.0.0"
port = 3000
request_timeout_secs = 60
rate_limit_rps = 10

[renderer]
mode = "auto"
page_timeout_ms = 30000
pool_size = 4
render_js_default = false
browser_binary = ""

[renderer.lightpanda]
ws_url = ""

[renderer.chrome]
ws_url = ""

[crawler]
max_concurrency = 40
requests_per_second = 40.0
respect_robots_txt = true
user_agent = "quickcrawl/0.1"
default_max_depth = 2
default_max_pages = 100
proxy = ""
job_ttl_secs = 3600

[crawler.stealth]
enabled = true
user_agents = []
jitter_factor = 0.2
inject_headers = true

[extraction]
default_format = "markdown"
only_main_content = true

[extraction.llm]
provider = "openai"
api_key = ""
model = "gpt-4o-mini"
base_url = ""
max_tokens = 8192
extraction_prompt = "You are a data extraction assistant. Extract structured data from the user's content according to the provided JSON schema. Return ONLY the JSON object that matches the schema."
response_format = "extracted_data"