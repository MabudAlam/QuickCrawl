[railway]
name = "quickcrawl"
description = "Web scraping and crawling API with interactive playground"

[cloakbrowser]
dockerfile = "infra/cloakbrowser/Dockerfile.cloak"
name = "cloakbrowser"
port = 9222

[cloakbrowser.variables]
PORT = "9222"

[searxng]
dockerfile = "infra/SearXNG/Dockerfile.searxng"
name = "searxng"
port = 8080

[searxng.variables]
PORT = "8080"

[server]
dockerfile = "infra/Dockerfile.server"
name = "server"
port = 3000
depends_on = ["searxng", "cloakbrowser"]

[server.variables]
PORT = "3000"
SEARCH__BASE_URL = "${{ searxng.URL }}/"
RENDERER__CHROME__WS_URL = "${{ cloakbrowser.URL }}"

[docs]
dockerfile = "infra/Dockerfile.docs"
name = "docs"
port = 9009

[docs.variables]
PORT = "9009"

[playground]
dockerfile = "infra/Dockerfile.playground"
name = "playground"
depends_on = ["server", "docs"]

[playground.variables]
NEXT_PUBLIC_BASE_URL = "${{ server.URL }}"
NEXT_PUBLIC_DOCS_URL = "${{ docs.URL }}"
PORT = "3001"
