name: Release to GHCR

on:
  push:
    tags:
      - 'v*'

env:
  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GHCR_USERNAME: ${{ github.actor }}
  REGISTRY: ghcr.io
  SERVER_IMAGE: ghcr.io/mabudalam/quickcrawl/quickcrawl-server
  PLAYGROUND_IMAGE: ghcr.io/mabudalam/quickcrawl/quickcrawl-playground

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Releasing version: ${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        run: echo $GHCR_TOKEN | docker login $REGISTRY -u $GHCR_USERNAME --password-stdin

      - name: Build and push server image
        run: |
          docker build -t ${{ env.SERVER_IMAGE }}:latest -t ${{ env.SERVER_IMAGE }}:${{ env.VERSION }} -f infra/Dockerfile.server .
          docker push ${{ env.SERVER_IMAGE }}:latest
          docker push ${{ env.SERVER_IMAGE }}:${{ env.VERSION }}

      - name: Build and push playground image
        run: |
          docker build -t ${{ env.PLAYGROUND_IMAGE }}:latest -t ${{ env.PLAYGROUND_IMAGE }}:${{ env.VERSION }} -f infra/Dockerfile.playground ./playground
          docker push ${{ env.PLAYGROUND_IMAGE }}:latest
          docker push ${{ env.PLAYGROUND_IMAGE }}:${{ env.VERSION }}