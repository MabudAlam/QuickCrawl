version: 2

env:
  - GO111MODULE=on

builds:
  - id: quickcrawl-mcp
    binary: quickcrawl-mcp
    main: ./cmd/mcp
    dir: .
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/MabudAlam/quickcrawl/internal/utils.DefaultLevel=error
      - -X github.com/MabudAlam/quickcrawl/internal/version.Version={{.Version}}
      - -X github.com/MabudAlam/quickcrawl/internal/version.Commit={{.ShortCommit}}
      - -X github.com/MabudAlam/quickcrawl/internal/version.BuildDate={{.Date}}

  - id: quickcrawl-cli
    binary: quickcrawl
    main: ./cli
    dir: .
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/MabudAlam/quickcrawl/internal/utils.DefaultLevel=error
      - -X github.com/MabudAlam/quickcrawl/internal/version.Version={{.Version}}
      - -X github.com/MabudAlam/quickcrawl/internal/version.Commit={{.ShortCommit}}
      - -X github.com/MabudAlam/quickcrawl/internal/version.BuildDate={{.Date}}

archives:
  - id: quickcrawl-mcp-archive
    ids:
      - quickcrawl-mcp
    name_template: "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: zip
    files:
      - quickcrawl.toml
      - README.md

  - id: quickcrawl-cli-archive
    ids:
      - quickcrawl-cli
    name_template: "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: zip
    files:
      - quickcrawl.toml
      - README.md

snapshot:
  version_template: "{{ .Version }}-next"

release:
  github:
    owner: MabudAlam
    name: QuickCrawl
  draft: true
  prerelease: auto

  footer: |
    ## Links

    - [Report an issue](https://github.com/MabudAlam/quickcrawl/issues)