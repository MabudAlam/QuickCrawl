version: 2

env:
  - GO111MODULE=on

builds:
  - id: quickcrawl-mcp
    binary: quickcrawl-mcp
    main: ./cmd/mcp
    dir: .
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -tags=""

archives:
  - id: quickcrawl-mcp-archive
    ids:
      - quickcrawl-mcp
    name_template: "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: zip
    files:
      - quickcrawl.toml
      - "*.md"

snapshot:
  version_template: "{{ .Version }}-next"

release:
  github:
    owner: MabudAlam
    name: QuickCrawl
  draft: true
  prerelease: auto

  footer: |
    ## Links

    - [Report an issue](https://github.com/MabudAlam/quickcrawl/issues)