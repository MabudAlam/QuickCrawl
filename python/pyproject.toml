[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quickcrawl"
version = "0.1.0"
description = "Python SDK for QuickCrawl web scraper — scrape, crawl, and map any website"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["web-scraping", "mcp", "ai-agent", "crawler", "scraper"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["platformdirs>=3.0"]

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-timeout>=2.0"]

[project.urls]
Homepage = "https://github.com/MabudAlam/quickcrawl"
Documentation = "https://github.com/MabudAlam/quickcrawl"
Repository = "https://github.com/MabudAlam/quickcrawl"

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120

[tool.hatch.build.targets.wheel]
packages = ["src/quickcrawl"]
